<!doctype html>
<meta charset="utf-8">
<title>MEP Grid Routing Debug Viewer</title>
<style>
  html,body{height:100%;margin:0;font:13px system-ui,sans-serif;background:#101317;color:#eef2f7}canvas{display:block;width:100%;height:100%}#ui{position:fixed;top:12px;left:12px;z-index:2;max-width:390px;padding:12px;background:#18212bdd;border:1px solid #4d6276;border-radius:6px}#status{margin-top:7px;line-height:1.45}.error{color:#ff9b9b}.ok{color:#a8e6b0}.legend{margin-top:8px}.swatch{display:inline-block;width:10px;height:10px;margin-right:4px}.orange{background:#ff7a00}.blue{background:#1685ff}.marker{background:#f5f06c}#selection{margin-top:8px;color:#d6e3ee}label{display:block;margin-top:5px}
</style>
<div id="ui"><b>MEP grid-routing schematic</b><br>Grid routing only — physical geometry and zero-clash validation pending.
  <label><input id="obstacles" type="checkbox" checked> Obstacle AABBs</label><div id="systems"></div>
  <div class="legend"><span class="swatch orange"></span>MAIN&nbsp;&nbsp;<span class="swatch blue"></span>BRANCH&nbsp;&nbsp;<span class="swatch marker"></span>endpoint / junction</div>
  <div id="status">Loading viewer module…</div><div id="selection">Click a route to inspect its identity and status.</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const status=document.querySelector('#status'),selection=document.querySelector('#selection'),scene=new THREE.Scene();scene.background=new THREE.Color(0x101317);
const camera=new THREE.PerspectiveCamera(55,1,.01,100000);camera.up.set(0,0,1);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=true;const obstacles=new THREE.Group(),routes=new THREE.Group(),markers=new THREE.Group();scene.add(obstacles,routes,markers);
const pickables=[],raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),vector=p=>new THREE.Vector3(p[0],p[1],p[2]);raycaster.params.Line.threshold=.16;
function fail(error){console.error(error);status.className='error';status.textContent=`Viewer error: ${error.message||error}`}
function validate(d){if(!d||d.schema_version!==1||d.units!=='m'||!Array.isArray(d.obstacles)||!d.network||!d.network.main||!Array.isArray(d.network.branches))throw new Error('Invalid viewer fixture schema (expected schema_version 1 with obstacle and network geometry).')}
function routePoints(edge){if(!Array.isArray(edge.world_centerline_m)||edge.world_centerline_m.length<2)throw new Error(`Route ${edge.edge_id||'<unknown>'} has missing geometry.`);return edge.world_centerline_m.map(vector)}
function fit(bounds){if(bounds.isEmpty())throw new Error('Fixture contains no renderable geometry.');const center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),radius=Math.max(size.length()/2,.5),distance=radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2));camera.near=Math.max(.01,distance/1000);camera.far=distance*100;camera.position.copy(center).add(new THREE.Vector3(distance*.8,-distance*.8,distance*.55));camera.updateProjectionMatrix();controls.target.copy(center);controls.maxDistance=distance*20;controls.update()}
function addRoute(edge,kind,bounds){const points=routePoints(edge);points.forEach(p=>bounds.expandByPoint(p));const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:kind==='MAIN'?0xff7a00:0x1685ff}));line.userData={edge,kind};routes.add(line);pickables.push(line);return line}
function addMarker(point,color,bounds){const mesh=new THREE.Mesh(new THREE.SphereGeometry(.14,16,12),new THREE.MeshBasicMaterial({color}));mesh.position.copy(vector(point));markers.add(mesh);bounds.expandByPoint(mesh.position)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}const xyz=p=>`(${p.map(v=>v.toFixed(3)).join(', ')})`;function showSelection(route){const e=route.userData.edge,w=e.world_centerline_m;selection.textContent=`${route.userData.kind}: ${e.edge_id} · ${e.system} · ${e.status} · grid length ${e.grid_path_length_m==null?'n/a':e.grid_path_length_m.toFixed(2)+' m'} · ${w.length} cells · start ${xyz(w[0])} → end ${xyz(w[w.length-1])} m`}
renderer.domElement.addEventListener('click',event=>{const r=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(pickables,false)[0];if(hit)showSelection(hit.object)});addEventListener('resize',resize);resize();
try{status.textContent='Loading fixture…';const response=await fetch('./viewer_fixture.json');if(!response.ok)throw new Error(`Fixture request failed (${response.status} ${response.statusText}).`);const data=await response.json();validate(data);const bounds=new THREE.Box3();for(const o of data.obstacles){const b=o.bounds;if(!b)throw new Error(`Obstacle ${o.global_id||'<unknown>'} has missing bounds.`);const size=new THREE.Vector3(b.max_x_m-b.min_x_m,b.max_y_m-b.min_y_m,b.max_z_m-b.min_z_m),center=new THREE.Vector3((b.min_x_m+b.max_x_m)/2,(b.min_y_m+b.max_y_m)/2,(b.min_z_m+b.max_z_m)/2);if(size.x<0||size.y<0||size.z<0)throw new Error(`Obstacle ${o.global_id||'<unknown>'} has invalid bounds.`);const mesh=new THREE.Mesh(new THREE.BoxGeometry(size.x,size.y,size.z),new THREE.MeshBasicMaterial({color:0x9cadbc,transparent:true,opacity:.18,depthWrite:false}));mesh.position.copy(center);obstacles.add(mesh);bounds.expandByObject(mesh)}const main=addRoute(data.network.main,'MAIN',bounds),branches=data.network.branches.map(edge=>addRoute(edge,'BRANCH',bounds));for(const endpoint of data.endpoints||[])addMarker(endpoint.world_m,0xf5f06c,bounds);if(data.junction&&Array.isArray(data.junction.world_m))addMarker(data.junction.world_m,0xff4fd8,bounds);fit(bounds);document.querySelector('#obstacles').onchange=e=>obstacles.visible=e.target.checked;const systems=[...new Set([main,...branches].map(x=>x.userData.edge.system))].sort(),systemBox=document.querySelector('#systems');systemBox.innerHTML=systems.map(system=>`<span><input type="checkbox" checked data-system="${system}"> ${system}</span>`).join(' ');systemBox.querySelectorAll('input').forEach(input=>input.onchange=()=>routes.children.forEach(line=>{if(line.userData.edge.system===input.dataset.system)line.visible=input.checked}));status.className='ok';status.textContent=`Fixture loaded successfully · ${1+branches.length} physical edges · 1 MAIN / ${branches.length} BRANCH · ${data.obstacles.length} obstacle boxes · ${data.scenario_id} · ${data.coordinate_frame}`;}catch(error){fail(error)}
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
